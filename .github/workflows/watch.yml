name: Payment watcher

# Every 5 minutes (GitHub's shortest schedule). Each run keeps checking every 30 seconds
# for about 4.5 minutes, so payments are checked almost continuously, like the VB timer.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# Never two runs at once; a new run waits for the previous one to finish.
concurrency:
  group: payment-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check payments
        run: node watcher.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          FIREBASE_DATABASE_URL: https://surfibox-default-rtdb.firebaseio.com
          RUN_SECONDS: '270'
          EVERY_SECONDS: '30'

  # SurfiTools (surfitools.com): approves its crypto payments the same way, in parallel.
  surfitools:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check SurfiTools payments
        run: node surfitools-watcher.mjs
        env:
          SURFITOOLS_SERVICE_ACCOUNT: ${{ secrets.SURFITOOLS_SERVICE_ACCOUNT }}
          SURFITOOLS_DATABASE_URL: https://surfitools-31a16-default-rtdb.firebaseio.com
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          RUN_SECONDS: '270'
          EVERY_SECONDS: '30'
