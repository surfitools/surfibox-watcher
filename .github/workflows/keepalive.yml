name: Keep alive

# GitHub switches off scheduled workflows in repositories with no activity for 60 days.
# This makes a tiny commit once a month so the payment watcher never stops.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "Keep the payment watcher schedule active"
          git push
